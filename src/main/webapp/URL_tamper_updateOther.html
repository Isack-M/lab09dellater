<html>

<head>
    <title>Exotic Fish Update</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: beige;
            font-family: sans-serif;
        }
    </style>
</head>

<body>
    <div>

        <h4>Enter the @GetMapping of the Exotic Fish Update API You Want To Call</h4>
        <input id="URL" size="80" value="/exoticFish/update?jsonData=">

        <h4>Enter the StringData Object that You Want To Update</h4>
        <p style="margin-left:1.5rem">
            A nice way to use this is to copy/paste a record from your
            other/getAll API, then edit it in the box below, then click
            "Call API".
        </p>
        <textarea id="URLparams" rows="20" cols="80">
{
    "exotic_fish_id": "1",
    "fishspecies_name": "Mandarin Fish",
    "image": "https://cis-linux2.temple.edu/tomcat11/fa26_3308_tur74385/pics/mandarinfish.jpg",
    "species_population": "18000",
    "depth_found": "15",
    "habitat": "Coral Reefs",
    "interesting_fact": "They secrete a toxic, foul-smelling mucus instead of having scales.",
    "web_user_id": "1"
}
            </textarea>
        <br />
        <button onclick="launchAPI()">Call API (opens in new tab)</button>

        <script>
            function launchAPI() {
                var api = document.getElementById("URL").value;
                api = api.trim();

                var URLparams = document.getElementById("URLparams").value;
                URLparams = URLparams.trim();
                //URLparams = URLparams.replace("\n", "");

                console.log("URL before encoding: " + api + URLparams);

                var url = api + encodeURIComponent(URLparams);
                console.log("URL after encoding: "+ url);

                window.open(url, "_blank");
            }

        </script>

    </div>
</body>

</html>
